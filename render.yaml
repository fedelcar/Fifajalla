services:
  - type: web
    name: fifajalla
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec unicorn -p $PORT -c config/unicorn.rb"
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually in Render dashboard to your Neon connection string
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
